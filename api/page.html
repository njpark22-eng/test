<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진동 FFT 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2933;
  --muted: #5f6b7a;
  --line: #d8dee6;
  --surface: #f5f7fa;
  --accent: #0c4ca3;
  --accent-press: #08397b;
  --ok: #2e7d4f;       --ok-bg: #e8f3ec;
  --warn: #a65a00;     --warn-bg: #fbefdc;
  --bad: #b3261e;      --bad-bg: #f9e3e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1620;
    --fg: #e6ebf1;
    --muted: #9aa7b5;
    --line: #263241;
    --surface: #17202c;
    --accent: #6ea4e8;
    --accent-press: #9bc0f0;
    --ok: #6fcf97;     --ok-bg: #14281e;
    --warn: #f0a954;   --warn-bg: #2d2112;
    --bad: #f28b82;    --bad-bg: #2f1816;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1620;
  --fg: #e6ebf1;
  --muted: #9aa7b5;
  --line: #263241;
  --surface: #17202c;
  --accent: #6ea4e8;
  --accent-press: #9bc0f0;
  --ok: #6fcf97;     --ok-bg: #14281e;
  --warn: #f0a954;   --warn-bg: #2d2112;
  --bad: #f28b82;    --bad-bg: #2f1816;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans KR", system-ui, "Malgun Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; font-weight: 700; margin: 0; color: var(--accent); }
h2 { font-size: 1.125rem; font-weight: 700; margin: 32px 0 12px; }
.note { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* 판정 표 */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-weight: 500; font-size: 0.875rem; color: var(--muted); background: var(--surface); }
th.num, td.num { text-align: right; }
td.ch { font-weight: 700; }

/* 판정 배지: 판정 색만 의미색을 쓰고 판정명 글자와 기호를 함께 둔다 */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.875rem;
  white-space: nowrap;
}
.badge::before { margin-right: 6px; }
.v-ok   { color: var(--ok);   background: var(--ok-bg); }
.v-ok::before   { content: "\2713"; }
.v-warn { color: var(--warn); background: var(--warn-bg); }
.v-warn::before { content: "!"; }
.v-bad  { color: var(--bad);  background: var(--bad-bg); }
.v-bad::before  { content: "\25B2"; }

/* 채널 카드 */
.card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px 8px; margin: 12px 0; }
.card header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.card header .name { font-weight: 700; }
.card header .meta { color: var(--muted); font-size: 0.875rem; }
.card .remeasure { margin: 8px 0 0; font-size: 0.875rem; color: var(--warn); }
svg.spec { width: 100%; height: auto; display: block; }
svg.spec text { font-family: inherit; fill: var(--muted); font-size: 11px; }
svg.spec .axis { stroke: var(--line); stroke-width: 1; }
svg.spec .curve { fill: none; stroke: var(--accent); stroke-width: 1.4; }
svg.spec .mark { stroke: var(--muted); stroke-width: 1; }
svg.spec .limit { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 2 3; }

pre.rules {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 16px;
  white-space: pre-wrap;
  font-family: inherit;
  font-size: 0.875rem;
  margin: 0;
}
.state { color: var(--muted); padding: 24px 0; }
.state.error { color: var(--bad); }

@media (max-width: 640px) {
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 4px 0; }
  td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 4px 12px; text-align: right; }
  td::before { content: attr(data-label); color: var(--muted); font-size: 0.875rem; text-align: left; }
  /* 그래프는 viewBox가 줄어들어 글자가 작아지므로 휴대폰에서는 글자와 선을 키운다 */
  svg.spec text { font-size: 24px; }
  svg.spec .curve { stroke-width: 3; }
  svg.spec .mark, svg.spec .limit { stroke-width: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  .state.loading::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }
}
</style>
</head>
<body>
<main>
  <h1>진동 FFT 진단</h1>
  <p class="note">가상 데이터, 규칙 기반 판정</p>
  <div id="out" class="state loading">분석 중</div>
</main>

<script>
const LIMIT_LABEL = "기준";

function verdictClass(v) {
  if (v === "정상") return "v-ok";
  if (v === "재계측 권장" || v === "베어링 점검 요망") return "v-warn";
  return "v-bad";
}

function fmt(n, d) { return Number(n).toFixed(d); }

function badge(v) { return `<span class="badge ${verdictClass(v)}">${v}</span>`; }

function table(channels) {
  const rows = channels.map(({ r, verdict }) => {
    const bearing = r.bearing_BPFO_hz === null ? "-" : fmt(r.ratio_bearing_over_1X, 2);
    return `<tr>
      <td class="ch" data-label="채널">${r.channel}</td>
      <td class="num" data-label="회전수 (rpm)">${r.rpm}</td>
      <td class="num" data-label="최대 피크 RMS (mm/s)">${fmt(r.peak_rms_mm_s, 2)} (기준 ${r.rms_limit_mm_s})</td>
      <td class="num" data-label="2X/1X">${fmt(r.ratio_2X_over_1X, 2)}</td>
      <td class="num" data-label="BPFO/1X">${bearing}</td>
      <td data-label="결함 진단">${badge(verdict)}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr><th>채널</th><th class="num">회전수 (rpm)</th><th class="num">최대 피크 RMS (mm/s)</th><th class="num">2X/1X</th><th class="num">BPFO/1X</th><th>결함 진단</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function spectrum({ r, f, amp }) {
  const W = 900, H = 230, L = 52, R = 12, T = 22, B = 34;
  const fmax = f[f.length - 1];
  const ymax = Math.max(...amp, r.rms_limit_mm_s * 1.3) * 1.08;
  const X = hz => L + (W - L - R) * hz / fmax;
  const Y = a => T + (H - T - B) * (1 - a / ymax);
  const curve = f.map((hz, i) => `${i ? "L" : "M"}${X(hz).toFixed(1)},${Y(amp[i]).toFixed(1)}`).join("");

  let xt = "";
  for (let hz = 0; hz <= fmax; hz += 100) {
    xt += `<line class="axis" x1="${X(hz)}" x2="${X(hz)}" y1="${H - B}" y2="${H - B + 4}"/>`
        + `<text x="${X(hz)}" y="${H - B + 17}" text-anchor="middle">${hz}</text>`;
  }
  // 1X/2X/BPFO는 색이 아니라 선 모양과 라벨로 구분
  const marks = [
    { hz: r.shaft_1X_hz, dash: "", label: "1X" },
    { hz: 2 * r.shaft_1X_hz, dash: "6 3", label: "2X" },
  ];
  if (r.bearing_BPFO_hz !== null) marks.push({ hz: r.bearing_BPFO_hz, dash: "12 4 2 4", label: "BPFO" });
  const lines = marks.filter(m => m.hz <= fmax).map((m, i) =>
    `<line class="mark" x1="${X(m.hz)}" x2="${X(m.hz)}" y1="${T}" y2="${H - B}" stroke-dasharray="${m.dash}"/>`
    + `<text x="${X(m.hz) + 3}" y="${T + 10 + i * 12}">${m.label} ${fmt(m.hz, 1)} Hz</text>`).join("");

  const ly = Y(r.rms_limit_mm_s);
  return `<svg class="spec" viewBox="0 0 ${W} ${H}" role="img" aria-label="${r.channel} FFT 스펙트럼">
    <line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
    <line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>
    ${xt}
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${fmt(ymax, 0)}</text>
    <text x="${L}" y="12">RMS (mm/s)</text>
    <text x="${W - R}" y="${H - 4}" text-anchor="end">주파수 (Hz)</text>
    <path class="curve" d="${curve}"/>
    <line class="limit" x1="${L}" x2="${W - R}" y1="${ly}" y2="${ly}"/>
    <text x="${W - R}" y="${ly - 4}" text-anchor="end">${LIMIT_LABEL} ${r.rms_limit_mm_s} mm/s</text>
    ${lines}
  </svg>`;
}

function card(c) {
  const { r, verdict } = c;
  const bearing = r.bearing_BPFO_hz === null ? "베어링 미사용" : `볼 ${r.bearing_balls}개`;
  const note = verdict === "재계측 권장"
    ? `<p class="remeasure">2 Hz 미만 저주파 노이즈(${fmt(r.lowfreq_noise_rms, 1)} mm/s)가 커서 1X와 2X를 가립니다. 센서 부착 상태와 케이블을 확인한 뒤 다시 계측하세요.</p>`
    : "";
  return `<section class="card">
    <header><span class="name">${r.channel}</span>${badge(verdict)}
      <span class="meta">${r.rpm} rpm · 1X ${fmt(r.shaft_1X_hz, 1)} Hz · ${bearing}</span></header>
    ${note}${spectrum(c)}</section>`;
}

async function load() {
  const out = document.getElementById("out");
  try {
    const res = await fetch("/api/analyze");
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "분석에 실패했습니다");
    out.className = "";
    out.innerHTML = `<h2>판정 결과</h2>${table(body.channels)}
      <h2>FFT 스펙트럼</h2>${body.channels.map(card).join("")}
      <h2>판정 규칙</h2><pre class="rules" id="rules"></pre>`;
    document.getElementById("rules").textContent = body.rules;
  } catch (e) {
    out.className = "state error";
    out.textContent = `불러오지 못했습니다. ${e.message}`;
  }
}
load();
</script>
</body>
</html>
