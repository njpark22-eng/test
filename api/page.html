<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진동 FFT 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/shared.css">
</head>
<body>
<main>
  <h1>진동 FFT 진단</h1>
  <p class="note">가상 데이터, 규칙 기반 판정</p>
  <div id="menu"></div>
  <div id="out" class="state loading">분석 중</div>
</main>

<script src="/assets/shared.js"></script>
<script>
document.getElementById("menu").innerHTML = nav("/");

async function load() {
  const out = document.getElementById("out");
  try {
    const res = await fetch("/api/analyze");
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "분석에 실패했습니다");
    out.className = "";
    out.innerHTML = `<h2>판정 결과</h2>${table(body.channels)}
      <h2>FFT 스펙트럼</h2>${body.channels.map(card).join("")}
      <h2>판정 규칙</h2><pre class="rules" id="rules"></pre>`;
    document.getElementById("rules").textContent = body.rules;
  } catch (e) {
    out.className = "state error";
    out.textContent = `불러오지 못했습니다. ${e.message}`;
  }
}
load();
</script>
</body>
</html>
